    # 未带参数或参数不匹配时正常渲染 go.html 页面处理
    try_files $uri =404;
}

# ------------------------------------------------------------------------------
# 3. 兜底回落 (若直接访问未显式声明的 /go/xxx 路由，交给 go.html 解析)
# ------------------------------------------------------------------------------
location /go/ {
    rewrite ^/go/(.*)$ /go.html?id=$1 last;
}
